tasks:
  - name: all
    actions:
      - task: health-check
      - task: create-dbs
      - task: verify-standalone-data

  - name: create-dbs
    actions:
      - description: Create the DB test package for the PG instance
        cmd: uds zarf package create tests --confirm --architecture="${UDS_ARCH}" --skip-sbom
      - description: Deploy the test package into the cluster
        cmd: uds zarf package deploy "zarf-package-postgres-test-${UDS_ARCH}-0.1.0.tar.zst" --confirm

  - name: health-check
    actions:
      - description: Postgresql Cluster Status
        wait:
          cluster:
            kind: pod
            name: app.kubernetes.io/name=postgres-operator
            namespace: postgres-operator
            condition: Ready

  - name: verify-standalone-data
    description: Read the original seeded row without reseeding so the check detects data loss after a lifecycle change.
    actions:
      - description: Read the witness from the standalone test database using its fixture role.
        maxRetries: 5
        cmd: |
          count=$(uds zarf tools kubectl -n acid exec statefulset/pg-cluster -c postgres -- \
            env -u PGHOST -u PGHOSTADDR PGOPTIONS="-c default_transaction_read_only=on" \
            psql -X -w -qAt --set=ON_ERROR_STOP=1 --username=myuser --dbname=mydb \
            -c "SELECT count(*) FROM public.tasks WHERE id = -1 AND name = 'uds-qualification-witness';") || exit 1
          test "$count" = 1
