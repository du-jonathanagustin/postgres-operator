apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/zalando/postgres-operator/80b7a074ada5221dc5eeac487c19faf810eb9cfe/charts/postgres-operator/crds/operatorconfigurations.yaml
  - https://raw.githubusercontent.com/zalando/postgres-operator/80b7a074ada5221dc5eeac487c19faf810eb9cfe/charts/postgres-operator/crds/postgresqls.yaml
  - https://raw.githubusercontent.com/zalando/postgres-operator/80b7a074ada5221dc5eeac487c19faf810eb9cfe/charts/postgres-operator/crds/postgresteams.yaml
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: '(operatorconfigurations|postgresqls|postgresteams)\.acid\.zalan\.do'
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: postgres-operator-crd-retention
        annotations:
          helm.sh/resource-policy: keep
